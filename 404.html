<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Bhairavi Thul</title>
<link rel="icon" href="favicon.ico">
<style>
  :root {
    --pink-dark: #b85468;
    --pink-light: #f7e9ec;
    --text-mid: #6b6b6b;
    --white: #ffffff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--pink-light);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 2rem 1.2rem;
  }

  .error-wrap {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }

  .error-code {
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--pink-dark);
    margin-bottom: 1.2rem;
  }

  .cat-wrap {
    width: 100%;
    max-width: 220px;
    margin: 0 auto 1.6rem;
  }

  .cat-wrap img {
    width: 100%;
    height: auto;
    display: block;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    color: #2b2b2b;
    margin: 0 0 0.8rem;
    line-height: 1.4;
  }

  p {
    font-size: 0.95rem;
    color: var(--text-mid);
    line-height: 1.6;
    margin: 0 0 2rem;
  }

  .home-btn {
    display: inline-block;
    background: var(--pink-dark);
    color: var(--white);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 0.8rem 1.8rem;
    border-radius: 999px;
    transition: opacity 0.2s ease;
  }

  .home-btn:hover {
    opacity: 0.85;
  }

  @media (max-width: 480px) {
    .cat-wrap { max-width: 170px; }
    h1 { font-size: 1.25rem; }
  }
</style>
</head>
<body>

  <div class="error-wrap">
    <div class="error-code">404 — Page Not Found</div>

    <div class="cat-wrap">
      <img src="images/judgy_cat.png" alt="A judgy black and white cat">
    </div>

    <h1>Hmm... that's sus.</h1>
    <p>You're looking for a page that doesn't exist. He is judging both of us right now.</p>

    <a class="home-btn" href="index.html">go back to home</a>
  </div>

</body>
</html>
